</g><text x="166" y="118" font-size="34" font-weight="800" font-style="italic" letter-spacing="-1" fill="#F4F1EA">CNSPK</text><text x="168" y="142" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" letter-spacing="3" fill="#6B7280">THE NUMBERS</text><rect x="772" y="88" width="224" height="46" rx="23" fill="#C7FF3E" fill-opacity="0.10" stroke="#C7FF3E" stroke-opacity="0.30" stroke-width="1.5"/><circle cx="798" cy="111" r="7" fill="#C7FF3E"/><text x="816" y="117" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="17" letter-spacing="1" fill="#C7FF3E">WHY IT MATTERS</text><line x1="84" y1="353" x2="120" y2="353" stroke="#C7FF3E" stroke-width="2"/><text x="134" y="360" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" letter-spacing="2" fill="#C7FF3E">// EUROPE-BY-THE-NUMBERS</text><text x="84" y="470" font-size="96" font-weight="800" font-style="italic" letter-spacing="-4" fill="#C7FF3E">80%+</text><text x="444" y="412" font-size="26" fill="#E8E3D6">of the EU's digital products, services</text><text x="444" y="448" font-size="26" fill="#E8E3D6">&amp; IP come from non-EU providers</text><line x1="84" y1="498" x2="996" y2="498" stroke="#2A2E37" stroke-width="1" stroke-dasharray="6 6"/><text x="84" y="640" font-size="96" font-weight="800" font-style="italic" letter-spacing="-4" fill="#C7FF3E">~70%</text><text x="444" y="582" font-size="26" fill="#E8E3D6">of Europe's cloud market = three US</text><text x="444" y="618" font-size="26" fill="#E8E3D6">giants: AWS, Azure, Google Cloud</text><line x1="84" y1="668" x2="996" y2="668" stroke="#2A2E37" stroke-width="1" stroke-dasharray="6 6"/><text x="84" y="810" font-size="96" font-weight="800" font-style="italic" letter-spacing="-4" fill="#C7FF3E">€264B</text><text x="444" y="752" font-size="26" fill="#E8E3D6">spent every year on US cloud</text><text x="444" y="788" font-size="26" fill="#E8E3D6">software (Asteres, 2025)</text><line x1="84" y1="838" x2="996" y2="838" stroke="#2A2E37" stroke-width="1" stroke-dasharray="6 6"/><line x1="84" y1="958" x2="996" y2="958" stroke="#2A2E37" stroke-width="1"/><text x="84" y="992" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" fill="#F4F1EA">cloudnativesecurity.pk</text><text x="996" y="992" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="17" text-anchor="end" fill="#6B7280">// source: EU Commission - AFP</text></svg>